<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ablag — Healthcare Complaint Platform Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2EA;
  --surface:#FFFFFF;
  --ink:#152420;
  --ink-soft:#5B6D66;
  --primary:#0C4A3B;
  --primary-dark:#082F26;
  --primary-tint:#E4EEE9;
  --gold:#B8863A;
  --gold-tint:#F5EBDA;
  --danger:#B23A2E;
  --danger-tint:#F8E7E4;
  --warning:#C9932F;
  --warning-tint:#FBF0DD;
  --success:#2E8B57;
  --success-tint:#E3F2E9;
  --line:#E3DECF;
  --radius:16px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(20,35,30,.04), 0 8px 24px -12px rgba(20,35,30,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Plus Jakarta Sans',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body.lang-ar{font-family:'Noto Sans Arabic','Plus Jakarta Sans',sans-serif}
.ar{font-family:'Noto Sans Arabic',sans-serif}
.mono{font-family:'IBM Plex Mono',monospace}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}

/* ===== Topbar ===== */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 28px;background:var(--primary-dark);color:#fff;
  position:sticky;top:0;z-index:50;
}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(155deg,var(--gold),#8C6425);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:16px;color:#1B1200;flex-shrink:0;
}
.brand-text .name{font-weight:700;font-size:16px;letter-spacing:.2px}
.brand-text .name .ar{opacity:.75;font-weight:500;margin-inline-start:6px;font-size:14px}
.brand-text .tag{font-size:11px;color:#B9CFC6;letter-spacing:.4px;text-transform:uppercase}
.top-right{display:flex;align-items:center;gap:10px}
.stage-chip{
  font-size:11px;padding:5px 10px;border-radius:999px;
  background:rgba(255,255,255,.1);color:#D8E6DF;border:1px solid rgba(255,255,255,.14);
}
.role-switch{
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.16);padding:6px 8px 6px 14px;border-radius:999px;
}
[dir="rtl"] .role-switch{padding:6px 14px 6px 8px}
.role-switch select{
  background:transparent;border:none;color:#fff;font-weight:600;font-size:13px;
  padding:4px 6px;border-radius:999px;
}
.role-switch select option{color:#111}
.exit-btn{
  background:#fff;color:var(--primary-dark);border:none;padding:8px 14px;
  border-radius:999px;font-weight:700;font-size:12.5px;
}
.lang-toggle{display:flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:3px;gap:2px}
.lang-toggle button{background:transparent;border:none;color:#D8E6DF;font-weight:700;font-size:12px;padding:6px 12px;border-radius:999px}
.lang-toggle button.on{background:var(--gold);color:#2A1B04}

/* ===== Layout ===== */
.app{display:flex;min-height:calc(100vh - 66px)}
.sidebar{
  width:250px;flex-shrink:0;background:var(--surface);border-inline-end:1px solid var(--line);
  padding:22px 14px;
}
.side-role{
  display:flex;gap:10px;align-items:center;padding:0 8px 18px 8px;margin-bottom:14px;
  border-bottom:1px solid var(--line);
}
.side-role .ic{width:34px;height:34px;border-radius:9px;background:var(--primary-tint);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-size:16px}
.side-role .lbl{font-size:12.5px;color:var(--ink-soft);line-height:1.3}
.side-role .lbl b{display:block;color:var(--ink);font-size:14px}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;
  font-size:13.5px;font-weight:600;color:var(--ink-soft);margin-bottom:2px;
}
.nav-item svg{width:17px;height:17px;flex-shrink:0}
.nav-item:hover{background:var(--bg)}
.nav-item.active{background:var(--primary-tint);color:var(--primary)}
.main{flex:1;padding:28px 32px;max-width:1180px}

/* ===== Landing / role picker ===== */
.landing{padding:56px 8vw 80px;max-width:1300px;margin:0 auto}
.landing-head{max-width:760px;margin-bottom:40px}
.hero-illustration{margin:0 0 44px;padding:20px 10px}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;font-size:11.5px;font-weight:700;
  letter-spacing:.6px;text-transform:uppercase;color:var(--gold);background:var(--gold-tint);
  padding:6px 12px;border-radius:999px;margin-bottom:16px;
}
[dir="rtl"] .eyebrow{text-transform:none}
.landing-head h1{font-size:34px;line-height:1.25;margin:0 0 12px;font-weight:800;letter-spacing:-.3px}
[dir="rtl"] .landing-head h1{font-size:30px;letter-spacing:0}
.landing-head p{color:var(--ink-soft);font-size:15.5px;line-height:1.7;max-width:640px}
.role-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:8px;
}
.role-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;text-align:start;transition:.15s;box-shadow:var(--shadow);
}
.role-card:hover{transform:translateY(-3px);border-color:var(--primary)}
.role-card .ic{
  width:44px;height:44px;border-radius:12px;background:var(--primary-tint);color:var(--primary);
  display:flex;align-items:center;justify-content:center;margin-bottom:14px;font-size:20px
}
.role-card h3{margin:0 0 6px;font-size:16px}
.role-card p{margin:0;color:var(--ink-soft);font-size:13px;line-height:1.6}
.role-card .go{margin-top:14px;font-size:12.5px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:5px}

/* ===== Common building blocks ===== */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.page-head h1{font-size:23px;margin:0 0 4px;font-weight:800;letter-spacing:-.2px}
[dir="rtl"] .page-head h1{letter-spacing:0}
.page-head .sub{color:var(--ink-soft);font-size:13.5px}
.btn{
  border:none;padding:10px 16px;border-radius:10px;font-weight:700;font-size:13px;
  display:inline-flex;align-items:center;gap:7px;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn-gold{background:var(--gold);color:#2A1B04}
.btn-danger-o{background:var(--danger-tint);color:var(--danger)}

.kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.kpi .n{font-size:26px;font-weight:800;letter-spacing:-.5px}
.kpi .l{font-size:12px;color:var(--ink-soft);margin-top:2px}
.kpi .trend{font-size:11.5px;font-weight:700;margin-top:8px;display:inline-flex;align-items:center;gap:4px}
.trend.up{color:var(--success)}
.trend.down{color:var(--danger)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card-pad{padding:20px}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-head h3{margin:0;font-size:14.5px}
.card-head .muted{color:var(--ink-soft);font-size:12px}

table{width:100%;border-collapse:collapse}
th{
  text-align:start;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);
  padding:10px 20px;border-bottom:1px solid var(--line);font-weight:700;
}
[dir="rtl"] th{text-transform:none}
td{padding:13px 20px;border-bottom:1px solid var(--line);font-size:13.5px;text-align:start}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:var(--bg)}
.ticket{font-family:'IBM Plex Mono',monospace;font-weight:600;color:var(--primary);font-size:12.5px}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px}
.b-open{background:var(--warning-tint);color:var(--warning)}
.b-review{background:var(--primary-tint);color:var(--primary)}
.b-resolved{background:var(--success-tint);color:var(--success)}
.b-escalated{background:var(--danger-tint);color:var(--danger)}
.kpi-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;flex-shrink:0}
.kpi-dot-green{background:var(--success)}
.kpi-dot-amber{background:var(--warning)}
.kpi-dot-red{background:var(--danger)}
.b-court{background:#EDE6F5;color:#6B3FA0}

.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.cat-card{
  background:var(--surface);border:2px solid var(--line);border-radius:var(--radius-sm);
  padding:16px;text-align:start;transition:.12s;
}
.cat-card:hover{border-color:var(--primary)}
.cat-card.sel{border-color:var(--primary);background:var(--primary-tint)}
.cat-card .ic{font-size:20px;margin-bottom:8px;display:block}
.cat-card b{display:block;font-size:13.5px;margin-bottom:2px}
.cat-card span{font-size:11.5px;color:var(--ink-soft)}

label.f{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin:16px 0 6px}
select.f,input.f,textarea.f{
  width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-family:inherit;
  font-size:13.5px;background:#FCFBF8;color:var(--ink);text-align:start;
}
textarea.f{resize:vertical;min-height:90px}

/* ===== Ticket rail ===== */
.rail{display:flex;align-items:flex-start;padding:26px 6px 6px;overflow-x:auto}
.rail-step{display:flex;flex-direction:column;align-items:center;flex:1;min-width:98px;position:relative}
.rail-step .dot{
  width:30px;height:30px;border-radius:50%;background:var(--line);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;z-index:2;
}
.rail-step .line{position:absolute;top:15px;height:2px;background:var(--line);width:100%;inset-inline-start:50%;z-index:1}
.rail-step:last-child .line{display:none}
.rail-step .txt{font-size:10.5px;text-align:center;margin-top:8px;color:var(--ink-soft);max-width:100px;line-height:1.3;font-weight:600}
.rail-step.done .dot{background:var(--success)}
.rail-step.done .line{background:var(--success)}
.rail-step.current .dot{background:var(--primary);box-shadow:0 0 0 5px var(--primary-tint)}
.rail-step.current .txt{color:var(--primary);font-weight:800}

.timeline{padding:4px 0}
.tl-item{display:flex;gap:14px;padding:0 0 22px}
.tl-item .dot2{width:9px;height:9px;border-radius:50%;background:var(--primary);margin-top:5px;flex-shrink:0}
.tl-item .body{flex:1;border-inline-start:2px solid var(--line);padding-inline-start:16px;margin-inline-start:-6px;padding-bottom:2px}
.tl-item:last-child .body{border-color:transparent}
.tl-item .meta{font-size:11px;color:var(--ink-soft);margin-bottom:3px}
.tl-item .head{font-weight:700;font-size:13.5px;margin-bottom:4px}
.tl-item .txt{font-size:13px;color:var(--ink-soft);line-height:1.6;background:var(--bg);border-radius:10px;padding:10px 12px}

.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.chip{font-size:11.5px;background:var(--bg);border:1px solid var(--line);padding:4px 10px;border-radius:999px;color:var(--ink-soft);font-weight:600}
.divider{height:1px;background:var(--line);margin:18px 0}

/* charts */
.bars{display:flex;align-items:flex-end;gap:14px;height:170px;padding:10px 6px;direction:ltr}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bar{width:100%;border-radius:6px 6px 0 0;background:var(--primary)}
.bar-lbl{display:flex;align-items:center;justify-content:center;gap:0;font-size:10.5px;color:var(--ink-soft);text-align:center;font-weight:600}
.bar-val{font-size:11px;font-weight:700}

.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
.legend .li{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft)}
.legend .sw{width:10px;height:10px;border-radius:3px;flex-shrink:0}

.region-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.region{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.region .n{font-size:20px;font-weight:800}
.region .r{font-size:12px;color:var(--ink-soft)}
.region .bar-mini{height:5px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden;direction:ltr}
.region .bar-mini i{display:block;height:100%;background:var(--gold)}

.breadcrumb{font-size:12px;color:var(--ink-soft);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.breadcrumb b{color:var(--primary);cursor:pointer}

::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:#D8D2C0;border-radius:8px}

/* ===== Icon sizing (SVG icon() output has no intrinsic size) ===== */
.side-role .ic svg,.role-card .ic svg,.cat-card .ic svg{width:20px;height:20px}
.doc-row .dic svg{width:16px;height:16px}
.brand-mark svg{width:19px;height:19px}
@media(max-width:380px){.brand-mark svg{width:16px;height:16px}}
.upload-ic svg{width:100%;height:100%}
.dropzone{cursor:pointer;transition:border-color .15s,background .15s}
.dropzone:hover{border-color:var(--primary)!important;background:var(--primary-tint)}
.attach-list{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.attach-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:12.5px}
.attach-row svg{width:15px;height:15px;flex-shrink:0;color:var(--ink-soft)}
.attach-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.attach-size{color:var(--ink-soft);font-size:11px}
.attach-remove{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:12px;padding:2px 6px}
.attach-remove:hover{color:#B23A2E}
.field-error{color:#B23A2E;font-size:12.5px;margin-top:8px;display:flex;align-items:center;gap:6px}
.mock-tag{display:inline-block;font-size:10px;color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 6px;margin-inline-start:6px;font-weight:600;letter-spacing:.03em}
.consultant-card svg{width:18px;height:18px}

/* ===== Interaction polish ===== */
select.f:focus,input.f:focus,textarea.f:focus{
  outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-tint);
}
.btn{transition:background .12s,border-color .12s,transform .08s}
.btn:active{transform:scale(.97)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-gold:hover{background:#A3752E}
.btn-danger-o:hover{background:#F2D5CF}
.nav-item{transition:background .12s,color .12s}
.role-card{transition:transform .15s,border-color .15s,box-shadow .15s}
.role-card:hover{box-shadow:0 12px 28px -14px rgba(10,20,16,.25)}

/* ===== Tables: never let a table break the page width ===== */
.card:has(table){overflow-x:auto}
table{min-width:540px}

/* ===== Topbar: wrap instead of overflow ===== */
.topbar{flex-wrap:wrap;row-gap:10px}
.top-right{flex-wrap:wrap;justify-content:flex-end}

/* ===== Breakpoint 1: tablet (≤900px) ===== */
@media(max-width:900px){
  .app{flex-direction:column}
  .sidebar{width:100%;display:flex;overflow-x:auto;gap:6px;padding:12px}
  .side-role{display:none}
  .role-grid,.kpi-row,.cat-grid,.grid2,.region-grid{grid-template-columns:1fr 1fr}
  .main{padding:22px 20px}
  .stage-chip{display:none}
}

/* ===== Breakpoint 2: large phone (≤600px) ===== */
@media(max-width:600px){
  .topbar{padding:12px 16px}
  .brand-text .tag{display:none}
  .role-switch span{display:none}
  .main{padding:18px 14px}
  .landing{padding:32px 5vw 56px}
  .landing-head h1{font-size:26px}
  [dir="rtl"] .landing-head h1{font-size:24px}
  .role-grid,.kpi-row,.cat-grid,.grid2,.region-grid{grid-template-columns:1fr}
  .page-head{align-items:flex-start}
  .modal{padding:20px}
  .two-col-form{grid-template-columns:1fr}
  .consultant-row{grid-template-columns:1fr}
}

/* ===== Breakpoint 3: small phone (≤380px) ===== */
@media(max-width:380px){
  .brand-mark{width:32px;height:32px;font-size:14px}
  .exit-btn{padding:7px 10px;font-size:11.5px}
  .lang-toggle button{padding:5px 9px}
}

/* ===== Modal ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,25,21,.55);backdrop-filter:blur(2px);
  z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal{
  background:var(--surface);border-radius:18px;max-width:560px;width:100%;
  max-height:88vh;overflow-y:auto;padding:26px;box-shadow:0 24px 60px -20px rgba(10,20,16,.35);
}
.modal h2{margin:0 0 6px;font-size:19px}
.modal .sub{color:var(--ink-soft);font-size:13.5px;margin-bottom:18px}
.modal-close{float:inline-end;background:var(--bg);border:none;width:30px;height:30px;border-radius:50%;font-size:15px;color:var(--ink-soft)}
[dir="rtl"] .modal-close{float:left}
.confirm-icon{
  width:52px;height:52px;border-radius:50%;background:var(--success-tint);color:var(--success);
  display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:14px;
}
.two-col-form{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.consultant-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}
.consultant-card{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;font-size:12.5px;color:var(--ink-soft)}
.consultant-card b{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}
.consultant-card .scfhs{font-size:11px;color:var(--ink-soft);margin-top:6px}
.consultant-card .sign{margin-top:8px;padding:5px;border-radius:6px;background:var(--primary-tint);color:var(--primary);font-size:11px;font-weight:700}
.doc-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:13px}
.doc-row .dic{width:32px;height:32px;border-radius:8px;background:var(--gold-tint);color:var(--gold);display:flex;align-items:center;justify-content:center;flex-shrink:0}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="brand-mark" id="brandMark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3 4 6.5v5c0 5 3.4 8.2 8 9.5 4.6-1.3 8-4.5 8-9.5v-5Z"/><path d="m9 12 2 2 4-4"/></svg></div>
    <div class="brand-text">
      <div class="name">Ablag <span class="ar">أبلج</span></div>
      <div class="tag" id="brandTag">Healthcare Complaint Platform · Prototype</div>
    </div>
  </div>
  <div class="top-right" id="topRight"></div>
</div>

<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<div style="position:fixed;bottom:8px;inset-inline-end:8px;z-index:150;font-size:10px;color:#8a9a93;background:rgba(255,255,255,.9);padding:3px 9px;border-radius:6px;font-family:'IBM Plex Mono',monospace;pointer-events:none;border:1px solid var(--line)">build 2026-10-28 15:10 UTC</div>

<div class="app" id="app"></div>

<script>
/* ---------------------------------------------------------
   i18n dictionaries
--------------------------------------------------------- */
const UI = {
en:{
  protoBadge:"Prototype · not connected to live data",
  viewingAs:"Viewing as",
  exitBtn:"Exit to role picker",
  brandTag:"Healthcare Complaint Platform · Prototype",

--------------------------------------------------------- */
let state = { role:null, screen:null, ticket:null, cat:null, lang:"en" };

function go(role, screen, extra){
  state.role = role; state.screen = screen; state.ticket = null;
  if(extra) Object.assign(state, extra);
  render();
  window.scrollTo({top:0});
}

function setLang(l){
  state.lang = l;
  document.documentElement.lang = l;
  document.documentElement.dir = l==="ar" ? "rtl" : "ltr";
  document.body.classList.toggle("lang-ar", l==="ar");
  render();
}

/* ---------------------------------------------------------
   Modal system
--------------------------------------------------------- */
function openModal(html){
  document.getElementById("modalContent").innerHTML = html;
  document.getElementById("modalOverlay").style.display = "flex";
}
function closeModal(){
  document.getElementById("modalOverlay").style.display = "none";
}

function todayStr(){
  const d = new Date();
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${months[d.getMonth()]} ${d.getDate()}, ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}
function newTicketId(){
  return "HC-" + (89000 + Math.floor(Math.random()*900));
}
function addLog(t, stageIdx, en, ar){
  t.log.push({stageIdx, m:todayStr(), en, ar});
}

function submitComplaint(){
  fieldError("fileFormError", "");
  if(!state.cat){ alert(state.lang==='ar' ? 'يرجى اختيار نوع الشكوى' : 'Please select a complaint category'); return; }
  const hospSel = document.getElementById("fileHospital");
  const hospKey = hospSel ? hospSel.value : Object.keys(HOSP)[0];
  const dateVal = (document.getElementById("fileIncidentDate")||{}).value || "";
  const desc = ((document.getElementById("fileDesc")||{}).value || "").trim();

  if(!dateVal){
    fieldError("fileFormError", state.lang==='ar' ? 'يرجى تحديد تاريخ الحادثة.' : 'Please enter the incident date.'); return;
  }
  if(new Date(dateVal) > new Date()){
    fieldError("fileFormError", state.lang==='ar' ? 'لا يمكن أن يكون تاريخ الحادثة في المستقبل.' : 'The incident date cannot be in the future.'); return;
  }
  if(desc.length < 20){
    fieldError("fileFormError", state.lang==='ar' ? 'يرجى وصف الحادثة بتفصيل أكبر (٢٠ حرفاً على الأقل).' : 'Please describe what happened in more detail (at least 20 characters).'); return;
  }

  const attachInput = document.getElementById("fileAttachInput");
  const attachCount = attachInput ? attachInput.files.length : 0;
  const id = newTicketId();
  const t = {
    id, catKey: state.cat, hospKey, patient:{en:"Abdullah A.",ar:"عبدالله أ."},
    incidentDate: dateVal, attachCount,
    stage:0, path:"open", status:"open", updated:{en:"just now",ar:"الآن"}, log:[]
  };
  addLog(t, 0,
    "Complaint filed: " + desc + (attachCount?` (${attachCount} file(s) attached)`:""),
    "تم تقديم شكوى: " + desc + (attachCount?` (${attachCount} ملف مرفق)`:"")
  );
  TICKETS.unshift(t);
  state.cat = null;
  openModal(confirmModal(
    state.lang==='ar' ? 'تم تقديم الشكوى' : 'Complaint submitted',
    state.lang==='ar' ? `رقم البلاغ: ${id} — سيصلك رد خلال 48 ساعة كحد أقصى.` : `Ticket number: ${id} — you'll receive a response within 48 hours.`,
    state.lang==='ar' ? 'عرض البلاغ' : 'View ticket',
    `closeModal();go('patient','track',{ticket:'${id}'})`
  ));
}

function sendProviderResponse(ticketId){
  fieldError("respFormError", "");
  const t = TICKETS.find(x=>x.id===ticketId);
  if(!t) return;
  const txt = ((document.getElementById("responseText")||{}).value || "").trim();
  if(txt.length < 10){
    fieldError("respFormError", state.lang==='ar' ? 'يرجى كتابة رد لا يقل عن ١٠ أحرف.' : 'Please write a response of at least 10 characters.'); return;
  }
  delete DRAFTS[ticketId];
  t.stage = Math.max(t.stage, 2);
  addLog(t, 2,
    "Provider response: " + txt,
    "رد مقدم الرعاية: " + txt
  );
  t.updated = {en:"just now", ar:"الآن"};
  openModal(confirmModal(
    state.lang==='ar' ? 'تم إرسال الرد' : 'Response sent',
    state.lang==='ar' ? 'انتقلت الحالة إلى مراجعة اللجنة الطبية.' : 'The case has moved to Medical Committee review.',
    state.lang==='ar' ? 'العودة إلى صندوق الوارد' : 'Back to inbox',
    `closeModal();go('provider','inbox')`
  ));
}
function saveDraft(ticketId){
  const txt = (document.getElementById("responseText")||{}).value || "";

    state.lang==='ar' ? 'تم حفظ المسودة' : 'Draft saved',

    en:{upheld:"in favor of the complaint", dismissed:"dismissing the complaint", settled:"ordering a settlement between the parties"},
    ar:{upheld:"لصالح الشكوى", dismissed:"برفض الشكوى", settled:"بتقرير تسوية بين الطرفين"}
  };
  t.stage = 7; t.status = "judgement";
  addLog(t, 7,
    "Specialized Court issued its final judgement, " + verdictText.en[verdict] + (notes?": "+notes:"") + ".",
    "أصدرت المحكمة المتخصصة حكمها النهائي، " + verdictText.ar[verdict] + (notes?": "+notes:"") + "."
  );
  t.updated = {en:"just now", ar:"الآن"};
  openModal(confirmModal(
    ar ? 'صدر الحكم النهائي' : 'Final judgement issued',
    `${ticketId} — ${ar?'الحالة الآن مغلقة بحكم نهائي من المحكمة.':'now closed with a final court judgement.'}`,
    ar ? 'العودة للقائمة' : 'Back to queue',
    `closeModal();go('commitment','queue')`
  ));
}

function S(){ return UI[state.lang]; }
function ltr(txt){ return `<span dir="ltr">${txt}</span>`; }
function escapeHtml(str){
  return String(str==null?"":str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function handleFileSelect(input, listId){
  const list = document.getElementById(listId);
  if(!list) return;
  const files = Array.from(input.files||[]);
  list.innerHTML = files.map((f,i)=>`
    <div class="attach-row">
      ${icon("doc")}
      <span class="attach-name">${escapeHtml(f.name)}</span>
      <span class="attach-size">${f.size > 1024*1024 ? (f.size/1024/1024).toFixed(1)+" MB" : Math.max(1,Math.round(f.size/1024))+" KB"}</span>
      <button type="button" class="attach-remove" onclick="removeAttach('${input.id}','${listId}',${i})">✕</button>
    </div>`).join("");
}
function removeAttach(inputId, listId, idx){
  const input = document.getElementById(inputId);
  if(!input) return;
  const dt = new DataTransfer();
  Array.from(input.files).forEach((f,i)=>{ if(i!==idx) dt.items.add(f); });
  input.files = dt.files;
  handleFileSelect(input, listId);
}
function fieldError(elId, msg){
  const el = document.getElementById(elId);

  el.innerHTML = msg ? `<span>⚠</span> ${escapeHtml(msg)}` : "";
}

  const q = escapeHtml(raw);
  const hit = PROVIDER_REGISTRY.find(p => p.nid === raw || p.scfhs === raw || p.nid.includes(raw) || p.scfhs.includes(raw));

// Traffic-light KPI status per hospital, per client's own framing on the call:
// green = accomplishing their work, red = not accomplished.
function perfStatus(h){
  const rate = h.resolved / h.complaints * 100;
  if(rate >= 65 && h.avgDays <= 8) return {cls:'green', label:{en:'On track', ar:'ضمن المستهدف'}};
  if(rate >= 50 && h.avgDays <= 10) return {cls:'amber', label:{en:'Needs attention', ar:'يحتاج متابعة'}};
  return {cls:'red', label:{en:'Below target', ar:'دون المستهدف'}};
}
function kpiDot(h){
  const s = perfStatus(h);
  return `<span class="kpi-dot kpi-dot-${s.cls}" title="${s.label[state.lang]}"></span>`;
}

function railHTML(currentStage, path){
  const names = STAGES[state.lang];
  return `<div class="rail">` + names.map((s,i)=>{
    let cls = i < currentStage ? "done" : i===currentStage ? "current" : "";
    return `<div class="rail-step ${cls}" style="${path==='resolved'&&i>currentStage?'opacity:.35':''}">
      <div class="line"></div>
      <div class="dot">${i<currentStage?'✓':i+1}</div>
      <div class="txt">${s}</div>
    </div>`;
  }).join("") + `</div>`;
}

    return `

      </g>`;

  const pathD = order.map((_,i)=> (pad+i*step) + "," + cy).join(" L ");
  return `<div class="landing">

/* ---------------------------------------------------------
   Shared ticket detail
--------------------------------------------------------- */
function ticketDetail(role){
  const s = S(); const td = s.ticketDetail;
  const t = TICKETS.find(x=>x.id===state.ticket) || TICKETS[0];
  const actions = {
    patient: (() => {
      if(t.status==='judgement') return `<button class="btn btn-ghost" onclick="viewFinalJudgement('${t.id}')">${td.viewJudgement}</button>`;
      if(t.status==='judgeWait') return `<button class="btn btn-ghost" onclick="viewJudgementBrief('${t.id}')">${td.viewJudgementBrief}</button>`;
      if(t.status==='hearing') return `<button class="btn btn-ghost" onclick="viewHearing('${t.id}')">${td.viewHearing}</button>`;
      if(t.status==='resolved') return `<button class="btn btn-ghost" disabled>${td.closed}</button>`;
      return '';
    })(),
    provider: `<button class="btn btn-primary" onclick="go('provider','respond',{ticket:'${t.id}'})">${td.openResponse}</button>`,
    hospital: t.status==='resolved' ? `<button class="btn btn-ghost" disabled>${td.closed}</button>` :
      (t.catKey==='error'
        ? `<button class="btn btn-gold" onclick="hospitalCommitteeModal('${t.id}')">${td.consultCommittee}</button>
           <button class="btn btn-danger-o" onclick="hospitalEscalate('${t.id}')">${td.escalate}</button>`
        : `<button class="btn btn-ghost" onclick="hospitalDirectClose('${t.id}')">${td.directClose}</button>
           <button class="btn btn-danger-o" onclick="hospitalEscalate('${t.id}')">${td.escalate}</button>`),
    commitment: (() => {
      if(t.status==='judgement') return `<button class="btn btn-ghost" disabled>${td.closed}</button>`;
      const lbl = t.status==='judgeWait' ? td.recordJudgement : t.status==='hearing' ? td.recordSession : td.openInvestigation;
      return `<button class="btn btn-primary" onclick="go('commitment','decision',{ticket:'${t.id}'})">${lbl}</button>`;
    })(),
  }[role] || "";

  const backMap = {patient:"track", provider:"inbox", hospital:"dashboard", commitment:"queue"};
  const stages = STAGES[state.lang];
  return `
    <div class="breadcrumb"><b onclick="go('${role}','${backMap[role]}',{ticket:null})">← ${td.back}</b></div>
    <div class="page-head">
      <div>
        <h1 class="ticket" style="font-size:20px">${ltr(t.id)}</h1>
        <div class="sub">${CATS[t.catKey][state.lang].t} · ${HOSP[t.hospKey][state.lang]} · ${td.filedBy} ${t.patient[state.lang]}</div>
      </div>
      <div style="display:flex;gap:8px">${badge(t.status)} ${actions}</div>
    </div>
    <div class="card" style="margin-bottom:18px">
      <div class="card-head"><h3>${td.journey}</h3><span class="muted">${td.stageOf(t.stage+1, stages.length)}</span></div>
      <div class="card-pad">${railHTML(t.stage, t.path)}</div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="card-head"><h3>${td.timeline}</h3></div>
        <div class="card-pad timeline">
          ${t.log.map(l=>`
            <div class="tl-item"><div class="dot2"></div>
              <div class="body">
                <div class="meta">${ltr(l.m)}</div>
                <div class="head">${stages[l.stageIdx]}</div>
                <div class="txt">${escapeHtml(l[state.lang])}</div>
              </div>
            </div>`).join("")}
        </div>
      </div>
      <div class="card card-pad" style="height:fit-content">
        <h3 style="margin-top:0;font-size:14px">${td.summary}</h3>
        <div class="chip">${td.ticketLbl} ${ltr(t.id)}</div><br>
        <div style="font-size:13px;color:var(--ink-soft);line-height:2;margin-top:10px">
          ${td.patientLbl} <b style="color:var(--ink)">${t.patient[state.lang]}</b><br>
          ${td.providerLbl} <b style="color:var(--ink)">${HOSP[t.hospKey][state.lang]}</b><br>
          ${td.categoryLbl} <b style="color:var(--ink)">${CATS[t.catKey][state.lang].t}</b><br>
          ${td.currentLbl} <b style="color:var(--ink)">${stages[t.stage]}</b>
        </div>
        <div class="divider"></div>
        <div style="font-size:12px;color:var(--ink-soft)">${td.footnote}</div>
      </div>
    </div>`;
}

      <table><thead><tr><th>${s.col.hospital}</th><th>${p.colComplaints}</th><th>${p.colResolved}</th><th>${p.colRate}</th><th>${p.colAvgDays}</th><th>${p.colStatus}</th></tr></thead>

        <tr><td>${HOSP[h.key][state.lang]}</td><td>${h.complaints}</td><td>${h.resolved}</td>
        <td>${Math.round(h.resolved/h.complaints*100)}%</td><td>${ltr(h.avgDays+"d")}</td><td>${kpiDot(h)}${perfStatus(h).label[state.lang]}</td></tr>`).join("")}</tbody></table>
    </div>`;
}

function donut(items){
  const total = items.reduce((a,b)=>a+b.val,0);
  let acc = 0;
  const r=52,cx=70,cy=70,circ=2*Math.PI*r;
  const segs = items.map(it=>{
    const frac = it.val/total;
    const dash = frac*circ;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${it.color}" stroke-width="18" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${cx} ${cy})"/>`;
    acc += dash;
    return seg;
  }).join("");
  return `<div style="display:flex;align-items:center;gap:20px">
    <svg width="140" height="140" viewBox="0 0 140 140" style="flex-shrink:0">${segs}</svg>
    <div class="legend" style="flex-direction:column;align-items:flex-start">
      ${items.map(it=>`<div class="li"><span class="sw" style="background:${it.color}"></span>${it.label} — ${it.val}%</div>`).join("")}
    </div>
  </div>`;
}

function lineChart(vals){
  const w=460,h=160,pad=24;
  const max=Math.max(...vals), min=Math.min(...vals);
  const pts = vals.map((v,i)=>{
    const x = pad + i*(w-2*pad)/(vals.length-1);
    const y = h-pad - (v-min)/(max-min||1)*(h-2*pad);
    return [x,y];
  });
  const path = pts.map((p,i)=>(i===0?"M":"L")+p[0]+","+p[1]).join(" ");
  const area = path + ` L${pts[pts.length-1][0]},${h-pad} L${pts[0][0]},${h-pad} Z`;
  return `<div style="direction:ltr"><svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="overflow:visible">
    <path d="${area}" fill="var(--primary-tint)"/>
    <path d="${path}" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--primary)"/>`).join("")}
  </svg></div>`;
}
